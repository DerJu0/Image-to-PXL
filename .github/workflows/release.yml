# Baut Image to PXL für macOS (Universal: Apple Silicon + Intel) und Windows.
#
# Auslöser:
#  - Tag "v…" pushen (z. B. v0.3.0)  -> baut und hängt die Dateien an das GitHub-Release
#  - Manuell unter "Actions" -> "Build & Release" -> "Run workflow"
#                                    -> Dateien unter "Artifacts" des Laufs herunterladen

name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Bauen (Apple Silicon + Intel)
        run: |
          cargo build --release --bins --target aarch64-apple-darwin
          cargo build --release --bins --target x86_64-apple-darwin

      - name: App-Paket erstellen
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP="dist/Image to PXL.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # Universal-Programme aus beiden Architekturen
          for BIN in pxl-gui pxl; do
            lipo -create -output "dist/$BIN" \
              "target/aarch64-apple-darwin/release/$BIN" \
              "target/x86_64-apple-darwin/release/$BIN"
          done
          cp dist/pxl-gui "$APP/Contents/MacOS/pxl-gui"

          # Icon (.icns) aus dem Pixel-Art-Icon
          cargo run --release --example make_icon -- --iconset dist/AppIcon.iconset
          iconutil -c icns dist/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Image to PXL</string>
            <key>CFBundleDisplayName</key><string>Image to PXL</string>
            <key>CFBundleIdentifier</key><string>io.github.image-to-pxl</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>pxl-gui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.graphics-design</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"

          # Ad-hoc-Signatur (ohne Apple-Developer-Konto; nötig für Apple Silicon)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          # Pakete
          ditto -c -k --keepParent "$APP" dist/Image-to-PXL-macOS.zip
          (cd dist && zip -q pxl-cli-macOS.zip pxl)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Image-to-PXL-macOS.zip
            dist/pxl-cli-macOS.zip

      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Image-to-PXL-macOS.zip
            dist/pxl-cli-macOS.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Bauen
        run: cargo build --release --bins

      - name: Dateien sammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pxl-gui.exe dist/pxl-gui.exe
          Copy-Item target/release/pxl.exe dist/pxl.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
